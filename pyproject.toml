[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dooma"
version = "1.0.3"
description = "The local-first terminal workspace for technical interview prep with 3,310 questions, 17,931 company mappings, fast search, mock interviews, and progress tracking."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anish Raj" }
]
keywords = ["dsa", "interview", "leetcode", "terminal", "cli", "algorithms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/im-anishraj/dooma"
Repository = "https://github.com/im-anishraj/dooma.git"
"Bug Tracker" = "https://github.com/im-anishraj/dooma/issues"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
dooma = "dooma.cli.main:app"

[tool.setuptools.packages.find]
include = ["dooma*"]

[tool.setuptools.package-data]
dooma = [
    "dataset/*.json",
    "data/index.json",
    "data/companies/*.yaml",
    "data/patterns/*.yaml",
    "data/questions/*.yaml",
    "data/sheets/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"] # Ignore line length for CLI string panels and DB queries

