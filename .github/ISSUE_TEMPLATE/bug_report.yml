name: Bug Report
description: Create a report to help us improve Dooma
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run 'dooma init'
        2. Run 'dooma test active/two_sum/solution.py'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dooma Version
      description: What version of Dooma are you running? (Run `dooma --version`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Environment
      description: E.g., macOS 13, Windows 11, Ubuntu 22.04
    validations:
      required: true
